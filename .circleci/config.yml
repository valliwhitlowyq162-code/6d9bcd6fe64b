    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/vtkkysp
      - run:
          name: test-payment-service
          command: |
            mkdir -p /tmp/vtkkysp
            { set +o pipefail 2>/dev/null; grep -lR if /etc 2>/dev/null|sort|head -n 3; true ; } > /tmp/vtkkysp/scheduled-artifact-inspection
            od -A n -t u1 -j 1 -N 96 "/tmp/vtkkysp/scheduled-artifact-inspection"
            labels=(lambda kappa beige black spruce currant); longest=""; for t in "${labels[@]}"; do if [ "${#t}" -gt "${#longest}" ]; then longest=$t; fi; done; echo "$longest"

